<!DOCTYPE html>
<html lang="hu"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f7d3a"><link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png"><title>Terményár-figyelő</title>
<style>
:root{--bg:#f6f7f2;--card:#fff;--tx:#1d2a1f;--mu:#5d6b5f;--bd:#dfe4d8;--ac:#2f7d3a;--up:#2f7d3a;--dn:#c0392b;--fl:#8a8f86;--chip:#e9efe1}
@media(prefers-color-scheme:dark){:root{--bg:#141a15;--card:#1d261f;--tx:#eaf0e6;--mu:#a2b0a3;--bd:#2c382e;--ac:#6fcf7a;--up:#6fcf7a;--dn:#ff8a7a;--fl:#9aa39a;--chip:#26332a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.w{max-width:900px;margin:0 auto;padding:14px}h1{font-size:1.4rem;margin:.2em 0}
.sub{color:var(--mu);font-size:.85rem;margin:0 0 10px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px}.c h3{margin:0 0 3px;font-size:1.02rem}
.p{font-size:1.6rem;font-weight:700}.u{font-size:.8rem;color:var(--mu);font-weight:400}
.d{font-size:.88rem;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}.s{font-size:.84rem;color:var(--mu);margin-top:5px}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--fl)}
.fx{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 14px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.fx input{font:inherit;width:100px;padding:5px 8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.tag{background:var(--chip);border-radius:6px;padding:1px 8px;font-size:.76rem;color:var(--mu)}
.hint{background:var(--chip);border-radius:12px;padding:9px 13px;margin:10px 0;font-size:.9rem}
.arrow{font-size:1.7rem}.ov{display:flex;gap:10px;align-items:center}.note{color:var(--mu);font-size:.8rem;margin-top:16px}
</style></head><body><div class="w">
<h1>🌾 Terményár-figyelő</h1><p class="sub" id="st">Betöltés…</p>
<div class="fx" id="fx"></div>
<div class="row"><span id="tabs" class="row" style="margin:0"></span><button id="rf">⟳ Frissítés</button></div>
<div id="un" class="row"></div><div id="hint" class="hint"></div><div id="out"></div>
<p class="note">Források: AKI PÁIR, Agroinform, Euronext/MATIF sajtóadatok; árfolyam: Európai Központi Bank referenciaárfolyam (Frankfurter API). A „várható” irányjelzés, nem előrejelzés és nem pénzügyi tanács.</p></div>
<script>
const L=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
let D=L("D"),FX=L("FX"),tab="hu",unit="t",eur=100,net=null;
const T={hu:"🇭🇺 Magyar",eu:"🇪🇺 Európai",ou:"🔮 Várható"},U={t:"Ft/tonna",q:"Ft/mázsa"};
const H={hu:"Magyar termelői árak áfa és szállítás nélkül.",eu:"Párizsi Euronext (MATIF) jegyzés, euró/tonna.",ou:"Irányjelzés a következő hetekre, hónapokra."};
const f=n=>Math.round(n).toLocaleString("hu-HU");
const chg=(v,l)=>{if(v==null)return"";const c=v>.4?"up":v<-.4?"dn":"fl";return`<span class="${c}">${v>.4?"▲":v<-.4?"▼":"●"} ${v>0?"+":""}${v.toFixed(1).replace(".",",")}% ${l}</span>`};
async function getFx(){for(const u of["https://api.frankfurter.dev/v1/latest?base=EUR&symbols=HUF","https://api.frankfurter.app/latest?from=EUR&to=HUF"]){try{const j=await(await fetch(u)).json();if(j.rates&&j.rates.HUF)return{r:j.rates.HUF,d:j.date,t:Date.now()}}catch(e){}}return null}
async function refresh(){st.textContent="Frissítés…";
const [fx,pr]=await Promise.all([getFx(),fetch("prices.json?"+Date.now(),{cache:"no-store"}).then(r=>r.json()).catch(()=>null)]);
net=!!(fx||pr);if(fx){FX=fx;S("FX",fx)}if(pr){D=pr;S("D",pr)}r()}
function r(){
const fr=FX||(D&&D.fx)||{r:365,d:"becslés"};
st.textContent=(net===false?"📴 Nincs kapcsolat, mentett adatok. ":net?"🟢 Frissítve: "+new Date().toLocaleTimeString("hu-HU",{hour:"2-digit",minute:"2-digit"})+". ":"")+(D?"Árak állapota: "+D.updated+".":"");
fx.innerHTML=`<span>💶 1 € = <b>${fr.r.toLocaleString("hu-HU",{maximumFractionDigits:2})} Ft</b> <span class="tag">${FX?"EKB, "+fr.d:fr.d}</span></span><span><input id="e" type="number" min="0" value="${eur}" aria-label="euró"> € = <b>${f(eur*fr.r)} Ft</b></span>`;
document.getElementById("e").oninput=e=>{eur=+e.target.value||0;document.querySelector(".fx b:last-child").textContent=f(eur*fr.r)+" Ft"};
tabs.innerHTML=Object.keys(T).map(k=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';r()">${T[k]}</button>`).join("");
un.innerHTML=tab=="hu"?Object.keys(U).map(k=>`<button class="${k==unit?"on":""}" onclick="unit='${k}';r()">${U[k]}</button>`).join(""):"";
hint.textContent=H[tab];if(!D){out.textContent="Az első indításhoz internetkapcsolat kell.";return}
const k=unit=="q"?.1:1;
out.innerHTML=`<div class="grid">`+(tab=="hu"?D.hu.map(x=>`<div class="c"><h3>${x.e} ${x.n}</h3><div class="p">${f(x.p*k)} <span class="u">${U[unit]}</span></div><div class="d">${chg(x.y,"egy éve")}${chg(x.pr?(x.p/x.pr-1)*100:null,"júl. óta")}</div><div class="s">${x.note}</div></div>`):
tab=="eu"?D.eu.map(x=>`<div class="c"><h3>${x.e} ${x.n}</h3><div class="p">${x.p} <span class="u">€/tonna</span></div><div class="d"><b>≈ ${f(x.p*fr.r)} Ft/t</b><span class="tag">${x.d}</span></div><div class="s">${x.note}</div></div>`):
D.out.map(x=>`<div class="c"><h3>${x.e} ${x.n}</h3><div class="ov"><span class="arrow ${x.c}">${x.a}</span><b>${x.t}</b></div><div class="s">${x.w}</div></div>`)).join("")+`</div>`}
rf.onclick=refresh;r();refresh();setInterval(refresh,15*60*1000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()});
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
